<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Registration | CCMS</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/citizen.css" />
</head>
<body class="align-items-center justify-content-center py-5" style="background: var(--bg-main);">

<div class="position-absolute top-0 end-0 p-4">
  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
    <i class="fas fa-moon"></i>
  </button>
</div>

<div class="container" style="max-width: 520px;">
  <div class="card-custom text-center p-4 p-md-5 shadow-lg">
    <!-- Brand Logo -->
    <a href="../index.html" class="d-inline-block mb-3">
      <h2 class="sidebar-logo mb-0" style="font-size:2.2rem;">CCMS</h2>
      <div class="text-muted small text-uppercase fw-bold" style="letter-spacing:2px; font-size:0.65rem;">Citizen Registration</div>
    </a>

    <h4 class="fw-bold text-heading mb-1">Create Citizen Account</h4>
    <p class="text-muted small mb-4">Join thousands of citizens fighting bribery &amp; public fraud</p>

    <form id="registerForm" onsubmit="handleRegistration(event)">
      <div class="row g-3 text-start">
        <div class="col-12">
          <label class="form-label small fw-bold text-heading">Full Name</label>
          <input type="text" class="form-control" id="regName" placeholder="e.g. Rajesh Kumar" required />
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold text-heading">Email Address</label>
          <input type="email" class="form-control" id="regEmail" placeholder="name@domain.com" required />
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold text-heading">Mobile Number</label>
          <input type="tel" class="form-control" id="regPhone" placeholder="+91 98765 43210" required />
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold text-heading">Password</label>
          <input type="password" class="form-control" placeholder="••••••••" required />
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold text-heading">Confirm Password</label>
          <input type="password" class="form-control" placeholder="••••••••" required />
        </div>

        <!-- Optional Email Verification Checkbox -->
        <div class="col-12">
          <div class="p-3 rounded bg-subtle border d-flex align-items-center justify-content-between">
            <div>
              <div class="fw-bold text-heading small">Send Email Verification OTP</div>
              <div class="text-muted" style="font-size:0.75rem;">Verify email address via 6-digit OTP code</div>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="otpSwitch" checked />
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 rounded-pill my-4" style="background:var(--gradient-brand); border:none;">
        Complete Registration <i class="fas fa-user-plus ms-1"></i>
      </button>

      <div class="text-muted small">
        Already registered? <a href="login.html" class="text-primary fw-bold">Sign In</a>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/citizen.js"></script>
<script>
  function handleRegistration(e) {
    e.preventDefault();
    const name = $('#regName').val();
    const email = $('#regEmail').val();
    const phone = $('#regPhone').val();

    if ($('#otpSwitch').is(':checked')) {
      const otp = prompt("Enter 6-digit Email Verification OTP sent to " + email + " (Simulation: Enter 123456):", "123456");
      if (otp !== "123456") {
        alert("Invalid OTP code!");
        return;
      }
    }

    // Save to local storage
    const user = {
      name: name,
      email: email,
      phone: phone,
      nationalId: "IND-2026-NEW",
      address: "Registered Citizen Address",
      joinedDate: "August 2026",
      avatarText: name.split(' ').map(n=>n[0]).join('').toUpperCase()
    };
    localStorage.setItem("ccms_user", JSON.stringify(user));

    alert("Registration Successful! Welcome to CCMS.");
    window.location.href = "index.html";
  }
</script>
</body>
</html>

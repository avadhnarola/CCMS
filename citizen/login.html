<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Login | CCMS</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/citizen.css" />
</head>
<body class="align-items-center justify-content-center py-5" style="background: var(--bg-main);">

<div class="position-absolute top-0 end-0 p-4">
  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
    <i class="fas fa-moon"></i>
  </button>
</div>

<div class="container" style="max-width: 440px;">
  <div class="card-custom text-center p-4 p-md-5 shadow-lg">
    <!-- Brand Logo -->
    <a href="../index.html" class="d-inline-block mb-3">
      <h2 class="sidebar-logo mb-0" style="font-size:2.2rem;">CCMS</h2>
      <div class="text-muted small text-uppercase fw-bold" style="letter-spacing:2px; font-size:0.65rem;">Citizen Portal</div>
    </a>

    <h4 class="fw-bold text-heading mb-1">Welcome Back</h4>
    <p class="text-muted small mb-4">Sign in to your secure whistleblower account</p>

    <form onsubmit="event.preventDefault(); window.location.href='index.html';">
      <div class="text-start mb-3">
        <label for="loginEmail" class="form-label small fw-bold text-heading">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-subtle border-end-0 text-muted"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control border-start-0" id="loginEmail" value="rajesh.kumar@example.com" placeholder="name@domain.com" required />
        </div>
      </div>

      <div class="text-start mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="loginPassword" class="form-label small fw-bold text-heading mb-0">Password</label>
          <a href="#" class="small text-primary fw-bold" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-subtle border-end-0 text-muted"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control border-start-0" id="loginPassword" value="••••••••" placeholder="Enter password" required />
        </div>
      </div>

      <div class="form-check text-start mb-4">
        <input class="form-check-input" type="checkbox" id="rememberMe" checked />
        <label class="form-check-input-label small text-muted" for="rememberMe">Remember me on this browser</label>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 rounded-pill mb-3" style="background:var(--gradient-brand); border:none;">
        Sign In <i class="fas fa-arrow-right ms-1"></i>
      </button>

      <div class="text-muted small">
        Don't have an account? <a href="register.html" class="text-primary fw-bold">Register Now</a>
      </div>
    </form>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-custom">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="fw-bold text-heading mb-0"><i class="fas fa-key text-primary me-2"></i>Reset Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-start">
        <p class="text-muted small">Enter your registered email address below. We will send a secure password reset link.</p>
        <div class="mb-3">
          <label class="form-label small fw-bold text-heading">Email Address</label>
          <input type="email" class="form-control" placeholder="name@domain.com" />
        </div>
        <button type="button" class="btn btn-primary w-100 fw-bold rounded-pill" onclick="alert('Password reset link sent to your email!'); $('#forgotModal').modal('hide');">
          Send Reset Link
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/citizen.js"></script>
</body>
</html>
